<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>깨달음의 가루 최적화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Spectral+SC:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>

<div class="wrap" id="authGate">
  <header class="top">
    <h1>깨달음의 가루 최적화</h1>
  </header>

  <section class="card">
    <h2 id="authTitle">로그인</h2>
    <div id="authFormFields">
      <div class="field">
        <label for="authUsername">아이디</label>
        <input type="text" id="authUsername" autocomplete="username" placeholder="영문/숫자 3~20자" />
      </div>
      <div class="field">
        <label for="authPassword">비밀번호</label>
        <input type="password" id="authPassword" autocomplete="current-password" placeholder="6자 이상" />
      </div>
      <div class="field" id="authPasswordConfirmField" style="display:none;">
        <label for="authPasswordConfirm">비밀번호 확인</label>
        <input type="password" id="authPasswordConfirm" autocomplete="new-password" placeholder="비밀번호 확인" />
      </div>
    </div>
    <div class="btnrow" id="authLoginBtns">
      <button class="primary" id="authLoginBtn">로그인</button>
      <button class="ghost" id="authSignupBtn">회원가입</button>
    </div>
    <div class="btnrow" id="authSignupBtns" style="display:none;">
      <button class="primary" id="authSignupSubmitBtn">가입하기</button>
      <button class="ghost" id="authSignupCancelBtn">로그인으로 돌아가기</button>
    </div>
    <div class="form-error" id="authError"></div>
    <div class="auth-success" id="authSuccess" style="display:none;">
      <p>등록 완료되었습니다.</p>
      <button class="primary" id="authGoLoginBtn">로그인하러 가기</button>
    </div>
  </section>
</div>

<div class="wrap" id="mainApp" style="display:none;">

  <header class="top">
    <h1>깨달음의 가루 최적화</h1>
    <div class="auth-status">
      <span id="authUserLabel"></span>
      <button class="ghost small" id="authLogoutBtn">로그아웃</button>
    </div>
  </header>

  <nav class="tabnav">
    <button class="tab-btn active" data-tab="registry">성유물 추가/보유 성유물</button>
    <button class="tab-btn" data-tab="build">캐릭터 스펙</button>
    <button class="tab-btn" data-tab="reforge">재구축 추천</button>
  </nav>

  <div class="tab-panel" id="tab-registry">

  <section class="card">
    <h2 id="formTitle">새 성유물 등록</h2>

    <div class="field">
      <label>부위</label>
      <div class="icon-select" id="slotKeyField"></div>
    </div>

    <div class="row2">
      <div class="field">
        <label>세트</label>
        <div class="icon-select" id="setKeyField"></div>
      </div>
      <div class="field">
        <label>장착 캐릭터</label>
        <div class="icon-select" id="locationField"></div>
      </div>
    </div>

    <div class="field">
      <label>주스탯 (풀강 고정값)</label>
      <div id="mainStatDisplay" class="mainstat-display"></div>
    </div>

    <label style="display:block; font-size:12.5px; color:var(--ink-dim); margin: 16px 0 6px;">부옵션 (최대 4개)</label>
    <div id="substatRows"></div>

    <label class="checkline">
      <input type="checkbox" id="startedWith4" checked />
      4줄 시작
    </label>

    <div class="btnrow">
      <button class="primary" id="saveBtn">성유물 등록</button>
      <button class="ghost" id="cancelBtn" style="display:none;">수정 취소</button>
    </div>
    <div class="form-error" id="formError"></div>
  </section>

  <section class="card">
    <h2>호요랩 붙여넣기로 등록</h2>
    <p class="reforge-note">호요랩 "캐릭터 정보" 화면에서 성유물 부분을 통째로 복사해서 그대로 붙여넣으면 자동으로 인식해서 등록해요. 장착 캐릭터는 지금 "캐릭터 스펙" 탭에서 고른 캐릭터로 채워져요.</p>
    <textarea id="hoyoInput" class="json-input" rows="8" placeholder="진실 갈망의 꽃
Lv.20 
HP
4780
공격력
14
치명타 피해
3
24.9%
...
(캐릭터 정보 화면 통째로 복사해서 붙여넣기)"></textarea>
    <div class="btnrow">
      <button class="primary" id="hoyoImportBtn">붙여넣기로 등록</button>
    </div>
    <div class="json-result" id="hoyoStatus"></div>
  </section>

  <section class="card">
    <h2>JSON으로 한번에 등록</h2>
    <textarea id="jsonInput" class="json-input" rows="8" placeholder='[
  {
    "slotKey": "flower",
    "setKey": "하늘 경계가 드러난 밤",
    "location": "플린스",
    "startedWith4Substats": true,
    "substats": [
      {"key": "critDMG_", "value": 24.9},
      {"key": "critRate_", "value": 11.7},
      {"key": "atk_", "value": 5.3},
      {"key": "atk", "value": 14}
    ]
  }
]'></textarea>
    <div class="btnrow">
      <button class="primary" id="jsonImportBtn">가져오기</button>
    </div>
    <div class="form-error" id="jsonError"></div>
    <div class="json-result" id="jsonResult"></div>
  </section>

  <section class="card">
    <div class="section-header-row">
      <h2>보유 성유물</h2>
      <button class="ghost" id="jsonExportBtnTop">내보내기</button>
    </div>
    <div id="listRoot"><div class="empty">등록된 성유물이 아직 없어요.</div></div>
    <div class="btnrow-right">
      <button class="ghost" id="jsonExportBtnBottom">내보내기</button>
    </div>
    <div class="json-result" id="exportStatus"></div>
  </section>

  </div>

  <div class="tab-panel" id="tab-build" style="display:none;">

  <section class="card">
    <div class="row2">
      <div class="field">
        <label>캐릭터</label>
        <div class="icon-select" id="buildCharSelectField"></div>
      </div>
      <div class="field">
        <label for="buildCharLevel">캐릭터 레벨</label>
        <select id="buildCharLevel"></select>
      </div>
    </div>
    <h2>부위별 성유물 선택</h2>
    <div id="buildSlotSelectors"></div>
  </section>

  <section class="card">
    <h2 id="buildResultsTitle">캐릭터 최종스펙</h2>
    <div id="buildResults" class="build-results"></div>
  </section>

  </div>

  <div class="tab-panel" id="tab-reforge" style="display:none;">

  <section class="card">
    <h2>재구축 우선순위</h2>
    <p class="reforge-note">깨달음의 가루 소모량 대비 CV 상승잠재력 기준으로 정렬됩니다.</p>

    <div class="field">
      <label for="dustSpentInput">현재 해석 진도 (다음 재구축 직전 기준, 0~17)</label>
      <input type="number" id="dustSpentInput" min="0" max="17" step="1" value="0" />
    </div>

    <button class="primary" id="reforgeRunBtn" style="width:100%; margin: 12px 0 4px;">재구축 추천 계산하기</button>
    <div id="reforgeResults"></div>
  </section>

  </div>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
